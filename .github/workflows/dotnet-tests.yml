name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UserAPI.Tests/UserAPI.Tests.csproj

      - name: Build
        run: dotnet build UserAPI.Tests/UserAPI.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test UserAPI.Tests/UserAPI.Tests.csproj --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: userapi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max