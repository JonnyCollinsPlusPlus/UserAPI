<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>UserAPI</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>UserAPI</h1>

    <!-- Logged-out view -->
    <div id="auth-view">
        <section>
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit">Login</button>
            </form>
            <p id="login-message"></p>
        </section>

        <section>
            <h2>Register</h2>
            <form id="register-form">
                <input type="email" id="register-email" placeholder="Email" required />
                <input type="text" id="register-username" placeholder="Username" required />
                <input type="password" id="register-password" placeholder="Password" required />
                <button type="submit">Register</button>
            </form>
            <p id="register-message"></p>
        </section>
    </div>

    <!-- Logged-in dashboard, hidden until authenticated -->
    <div id="dashboard-view" class="hidden">
        <section>
            <h2>My Account</h2>
            <p><strong>Username:</strong> <span id="my-username"></span></p>
            <p><strong>Email:</strong> <span id="my-email"></span></p>
            <p><strong>Role:</strong> <span id="my-role"></span></p>
            <button id="logout-btn">Logout</button>
        </section>

        <section id="admin-section" class="hidden">
            <h2>Admin: All Users</h2>
            <button id="load-users-btn">Refresh List</button>
            <ul id="users-list"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
